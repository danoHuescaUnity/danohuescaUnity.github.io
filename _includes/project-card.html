<article class="project-card" data-category="{{ include.project.category }}" data-project="{{ include.project.id }}">
  <div class="project-card__media">
    {% if include.project.video and include.project.video != "" %}
      <video
        class="project-card__video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        poster="{{ include.project.thumb | relative_url }}"
      >
        <source src="{{ include.project.video | relative_url }}" type="video/mp4">
      </video>
    {% else %}
      <img
        class="project-card__thumb"
        src="{{ include.project.thumb | relative_url }}"
        alt="{{ include.project.title }}"
        loading="lazy"
      >
    {% endif %}

    <div class="project-card__overlay">
      <button class="btn btn--outline btn--sm project-card__btn" data-modal="{{ include.project.id }}">
        View Details
      </button>
    </div>
  </div>

  <div class="project-card__content">
    ...
  </div>
</article>
