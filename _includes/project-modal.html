<div class="modal" id="project-modal" aria-hidden="true">
  <div class="modal__backdrop" data-close-modal></div>
  <div class="modal__container">
    <button class="modal__close" data-close-modal aria-label="Close modal">
      <i class="fas fa-times"></i>
    </button>
    <div class="modal__content" id="modal-content">
      <!-- Content injected by JS -->
    </div>
  </div>
</div>

<script type="text/template" id="modal-template">
  <div class="modal__media">
    <video class="modal__video" controls poster="{thumb}">
      <source src="{video}" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>
  <div class="modal__body">
    <div class="modal__header">
      <h2 class="modal__title">{title}</h2>
      <p class="modal__meta">
        <span class="modal__company">{company}</span>
        <span class="modal__divider">—</span>
        <span class="modal__role">{role}</span>
      </p>
    </div>
    <div class="modal__tags">
      {platforms}
      {tech}
    </div>
    <div class="modal__section">
      <h3>Overview</h3>
      <p>{full_desc}</p>
    </div>
    <div class="modal__section">
      <h3>Responsibilities</h3>
      <ul class="modal__list">{responsibilities}</ul>
    </div>
    <div class="modal__section">
      <h3>Challenges Solved</h3>
      <ul class="modal__list">{challenges}</ul>
    </div>
  </div>
</script>

<script>
  window.projectsData = [
    {% for project in site.data.projects %}
    {
      id: "{{ project.id }}",
      title: "{{ project.title }}",
      company: "{{ project.company }}",
      role: "{{ project.role }}",
      short_desc: "{{ project.short_desc | escape }}",
      full_desc: {{ project.full_desc | jsonify }},
      platforms: {{ project.platforms | jsonify }},
      tech: {{ project.tech | jsonify }},
      category: "{{ project.category }}",
      video: "{{ project.video | relative_url }}",
      thumb: "{{ project.thumb | relative_url }}",
      screenshots: {{ project.screenshots | jsonify }},
      responsibilities: {{ project.responsibilities | jsonify }},
      challenges: {{ project.challenges | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
